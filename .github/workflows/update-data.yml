name: Opdater og publicer resultatmåling
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "50 7,8,9,10,12,14 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: resultatmaal-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent og valider data fra samme kildecommit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_data.py
      - name: Gem opdaterede data
        run: |
          git add data/rm01ak.json status/rm01ak.json
          if ! git diff --cached --quiet; then
            git config user.name "Dashboard automation"
            git config user.email "dashboard-automation@users.noreply.github.com"
            git commit -m "Synkroniser kontrollerede RM01AK-data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Klargør kun webfiler
        run: |
          mkdir -p _site/data _site/status
          cp index.html app.js style.css efteraar.css .nojekyll _site/
          cp data/rm01ak.json _site/data/
          cp status/rm01ak.json _site/status/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
